app = "zencash"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ZFORUM_ORIGIN = "https://zenzcash.com"
  ZFORUM_RP_ID = "zenzcash.com"
  ZFORUM_BOOTSTRAP = "0"

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"

[[mounts]]
  source = "zforum_data"
  destination = "/data"
  initial_size = "3gb"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "1m"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
